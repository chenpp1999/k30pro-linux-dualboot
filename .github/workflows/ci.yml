name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          set -e
          files=$(git ls-files '*.sh'; echo tools/m0/init; \
                  echo tools/m1/m1b/usr/sbin/m1-weston; \
                  echo tools/m1/m1b/usr/sbin/lmi-time-save; \
                  echo tools/m1/m1b/etc/init.d/m1-weston; \
                  echo tools/m1/m1b/etc/init.d/ntpd)
          if [ -n "$files" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            # SC2187: tools/m0/init has a busybox shebang; it is intentionally
            # POSIX/dash-compatible and must stay byte-identical to the built artifact.
            echo "$files" | xargs shellcheck -e SC2187
          else
            echo "no shell scripts yet"
          fi

      - name: Guard rails (test-plan T0)
        run: sh tools/ci/checks.sh

      - name: M2 switch tests (offline, no partitions touched)
        run: sh tools/tests/m2-switch-test.sh

      - name: Markdown link check (basic)
        run: |
          set -e
          if git ls-files '*.md' | grep -q .; then
            echo "markdown files present (local links checked by tools/ci/checks.sh)"
          fi
