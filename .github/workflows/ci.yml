name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Safety net (issue #18): every run so far was manual workflow_dispatch --
  # push events never created a run (likely the push credential suppresses
  # workflow events). A daily schedule keeps CI honest without relying on
  # anyone remembering to dispatch it.
  schedule:
    - cron: '23 2 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          set -e
          # Every *.sh, plus every extension-less script under tools/ whose first
          # line is a shell/openrc shebang (the payload ships ELF binaries too,
          # and etc/conf.d/* are sourced config fragments, not scripts).
          files=$(git ls-files '*.sh')
          for f in $(git ls-files tools); do
            case "$f" in
              *.sh) continue ;;
              */etc/conf.d/*) continue ;;
            esac
            head -n1 "$f" 2>/dev/null | grep -qE '^#!.*(/sh$|/sh |/ash|openrc-run|env sh|busybox sh)' || continue
            files="$files $f"
          done
          if [ -n "$files" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            # -S warning: notes/stylistic hints (e.g. SC2015 "A && B || C") are
            # not failures.  SC2187: tools/m0/init has a busybox shebang; it is
            # intentionally POSIX/dash-compatible and must stay byte-identical to
            # the built artifact.  OpenRC init scripts carry a `shell=sh`
            # directive; their service variables are consumed by OpenRC.
            echo "$files" | xargs shellcheck -S warning -e SC2187
          else
            echo "no shell scripts yet"
          fi

      - name: Guard rails (test-plan T0)
        run: sh tools/ci/checks.sh

      - name: M2 switch tests (offline, no partitions touched)
        run: |
          sh tools/tests/m2-switch-test.sh
          sh tools/tests/m2-action-test.sh

      - name: M3 repart planner tests (offline, synthetic disk image)
        run: |
          sudo apt-get install -y -qq gdisk
          sh tools/tests/m3-repart-test.sh

      - name: M5 installer tests (offline, synthetic super/boot images)
        run: |
          sh tools/tests/m5-lp-parse-test.sh
          sh tools/tests/m5-firstboot-test.sh
          sh tools/tests/m5-install-test.sh
          sh tools/tests/m5-install-sim-test.sh

      - name: Markdown link check (basic)
        run: |
          set -e
          if git ls-files '*.md' | grep -q .; then
            echo "markdown files present (local links checked by tools/ci/checks.sh)"
          fi
