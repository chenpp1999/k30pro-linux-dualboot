name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          set -e
          files=$(git ls-files '*.sh' || true)
          if [ -n "$files" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            echo "$files" | xargs shellcheck
          else
            echo "no shell scripts yet"
          fi

      - name: Markdown link check (basic)
        run: |
          set -e
          if git ls-files '*.md' | grep -q .; then
            echo "markdown files present"
          fi
