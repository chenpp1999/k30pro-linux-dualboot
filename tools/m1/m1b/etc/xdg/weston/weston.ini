[output]
name=DSI-1
mode=preferred
scale=2

[terminal]
font-size=16

[output]
name=Virtual-1
mode=off

[shell]
panel-position=top
clock-format=minutes-24h
background-color=0xff101418
background-image=/usr/share/lmi/wallpaper.png
panel-color=0xff202830

[launcher]
icon=/usr/share/lmi/term-icon.png
path=/usr/bin/weston-terminal --maximized --font-size=16

[launcher]
icon=/usr/share/lmi/editor-icon.png
path=/usr/bin/weston-editor
