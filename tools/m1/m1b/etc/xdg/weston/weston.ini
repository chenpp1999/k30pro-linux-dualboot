[output]
name=DSI-1
mode=preferred
scale=2

[terminal]
font-size=16
# cairo's toy font API (weston-terminal) does not do per-glyph fallback:
# request a CJK-capable monospace face so Chinese text renders (audit 6.5)
font=WenQuanYi Zen Hei Mono
# Every weston-terminal starts with the lmi cheat sheet as its "shell": it prints
# the big banner + command table and then drops into a normal shell, so *all*
# terminals (panel launcher, extra windows, wrapper) show the help.  Set
# LMI_NO_MOTD=1 in the environment to skip it for a plain terminal.
shell=/usr/sbin/lmi-help
# Logical pixels kept free at the bottom so the shell prompt is never hidden
# behind the on-screen keyboard (patches 0013/0014/0016).  Measured on the K30
# Pro: the 540x1200 panel plus the keyboard client (shortcut bar + key rows)
# occupy the bottom 480 px, and weston keeps that keyboard mapped permanently,
# so the reservation is unconditional.  0 = stock behaviour.
keyboard-inset=480

[output]
name=Virtual-1
mode=off

[shell]
panel-position=top
clock-format=minutes-24h

[launcher]
icon=/usr/share/lmi/term-icon.png
path=/usr/bin/weston-terminal --maximized

[launcher]
icon=/usr/share/lmi/editor-icon.png
path=/usr/bin/weston-editor

# Flashlight: the icon runs lmi-torch with no args, which toggles the flash LED
# (the QPNP flash driver needs the torch level + the matching switch; see
# tools/m1/m1b/usr/sbin/lmi-torch).  Tap again to turn it off.
[launcher]
icon=/usr/share/lmi/torch-icon.png
path=/usr/sbin/lmi-torch
